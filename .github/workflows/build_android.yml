name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Buildozer directories
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          ~/.gradle
          ~/.android
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build with Buildozer in Docker
      run: |
        docker run --rm \
          -v $(pwd):/home/user/hostcwd \
          -e BUILDOZER_ALLOW_ROOT=1 \
          kivy/buildozer:latest \
          bash -c "yes | buildozer -v android debug"

    - name: Correct permissions
      run: |
        sudo chmod -R 777 bin/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-scanner-apk
        path: bin/*.apk
